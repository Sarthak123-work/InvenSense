server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${MYSQL_ROOT_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:Y2hhbmdlLWl0LXNlY3JldC1rZXktZm9yLWludmVuc2Vuc2UtdGhhdC1pcy1sb25nLWVub3VnaC1mb3ItaHMzNTY=}
  access-token-validity-minutes: 30
  refresh-token-validity-days: 7
