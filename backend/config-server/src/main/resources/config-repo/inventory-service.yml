server:
  port: 8083

spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/inventory_db}
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

inventory:
  concurrency:
    unsafe-mode: false
    max-retries: 3
    lock-lease-time-ms: 5000
    lock-wait-time-ms: 3000
